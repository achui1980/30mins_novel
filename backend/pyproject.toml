[project]
name = "novel-kg-backend"
version = "0.1.0"
description = "30-min novel knowledge graph backend: ingest -> extract -> graphify -> summarize"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "graphifyy>=0.1",
    "strands-agents>=0.1",
    "openai>=1.40",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
