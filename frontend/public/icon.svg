<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- background: 宣纸 paper square with hairline ink border -->
  <rect x="2" y="2" width="508" height="508" rx="104" fill="#FAF6EE" stroke="#D9D2C4" stroke-width="4"/>

  <!-- book: cover + thread-bound spine (seal-red, echoes 线装书 + 印章 stamp color) -->
  <rect x="136" y="180" width="240" height="196" rx="16" fill="#2B2724"/>
  <rect x="136" y="180" width="38" height="196" rx="16" fill="#B33A3A"/>
  <rect x="156" y="180" width="18" height="196" fill="#B33A3A"/>

  <!-- book title character, carved into the cover -->
  <text x="277" y="304" font-family="'Noto Serif SC', Georgia, serif" font-size="146"
        font-weight="700" fill="#F3ECDD" text-anchor="middle">书</text>

  <!-- knowledge graph rising from the book: nodes + edges -->
  <g stroke="#6B6259" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M304 200 L332 146"/>
    <path d="M332 146 L376 108"/>
    <path d="M332 146 L302 96"/>
  </g>
  <circle cx="332" cy="146" r="14" fill="#B33A3A"/>
  <circle cx="376" cy="108" r="11" fill="#3F5B4E"/>
  <circle cx="302" cy="96"  r="10" fill="#C9A15B"/>

  <!-- 30-minute timer badge (stopwatch), slightly rotated like a real ink chop: "30分钟" -->
  <g transform="rotate(-6 402 404)">
    <rect x="390" y="352" width="24" height="14" rx="4" fill="#8F2C2C"/>
    <circle cx="402" cy="404" r="42" fill="#B33A3A"/>
    <circle cx="402" cy="404" r="33" fill="none" stroke="#F5DEDA" stroke-width="3"/>
    <text x="402" y="417" font-family="Arial, Helvetica, sans-serif" font-size="32"
          font-weight="800" fill="#F5DEDA" text-anchor="middle">30</text>
  </g>
</svg>
